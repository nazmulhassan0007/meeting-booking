<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEN Group · Meeting Room Kiosk (tablet prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --ink:#0b2236; --muted:#5b7186; --blue:#0a5c9c; --blue-d:#084a7e;
  --ok:#14833b;--ok-bg:#d9f4e2;--ok-ink:#0f6a31;--bad:#c8102e;--bad-bg:#ffe3e8;--bad-ink:#9b1230;--bad-line:#f4b8c1;--green:#14833b; --amber:#c98a0a; --crimson:#9b1239; --red:#c8102e;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif; --disp:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#1b2733;font-family:var(--sans);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:28px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus{outline:none}
:focus-visible{outline:3px solid #ffbf2f;outline-offset:3px;border-radius:12px}
.sheet :focus-visible,.modal :focus-visible,.menu :focus-visible{outline-color:var(--blue)}
#stage{width:834px;height:1194px;transform-origin:center center;flex:none}
.device{--blue:#0a5c9c;--blue-d:#084a7e;--ink:#0b2236;--muted:#5b7186;--hdink:#0b1b2b;--paper:#fff;--paper2:#eef2f6;--line:#cbd8e3;--glass:rgba(255,255,255,.62);position:relative;width:834px;height:1194px;overflow:hidden;border-radius:6px;transition:background .8s;
  background:linear-gradient(180deg,#d6e9f7 0%,#4aa9dd 38%,#0f7c9c 62%,#06406b 80%,#052f52 100%)}
.device.upcoming{--blue:#9a6a00;--blue-d:#7a5400;--ink:#3d2b00;--muted:#7a5c10;--hdink:#3d2b00;--paper:#fffbe6;--paper2:#fff0b3;--line:#e8cf7a;--glass:rgba(255,246,190,.62);background:linear-gradient(180deg,#fffbd6 0%,#ffe45c 34%,#ffcf1f 66%,#f0a800 100%)}
.hero.busy .pill,.hero.ending .pill{display:none}
.hero.busy .top,.hero.ending .top{position:static;opacity:.85;font:500 15px var(--disp)}
.hero.busy,.hero.ending{height:auto;min-height:0;gap:12px;flex:none}
.cd7{display:flex;justify-content:center;gap:26px;margin-top:2px}
.g7{display:flex;flex-direction:column;align-items:center;gap:8px}
.pair{display:flex;gap:8px}
.dg{width:66px;height:90px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}
.gl7{font:600 15px var(--sans);color:#fff}
.hero.busy .dg,.hero.ending .dg{background:rgba(214,20,52,.35);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.hero.ending .dg{color:#ffe3ea}
.actions.busy .act:not(.light),.actions.ending .act:not(.light){background:#b3123f;border-color:#b3123f}
.actions.busy .act:not(.light) .ic,.actions.ending .act:not(.light) .ic{background:rgba(255,255,255,.22)}
.hero .rule{height:1px;background:rgba(255,255,255,.3);margin-top:2px}
.hero .bk{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font:600 18px var(--disp)}
.hero .bk span{font:400 19px var(--disp);opacity:.82;text-align:right}
.hero .bkby{font:400 15px var(--sans);opacity:.8;margin-top:-6px}
.hero>.photo,.hero>.shade{position:absolute;inset:0;width:100%;height:100%}
.hero>.photo{object-fit:cover;object-position:50% 38%}
.hero>.shade{backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);background:linear-gradient(246.66deg,rgba(2,54,87,.2) 2.7%,rgba(0,3,4,.82) 103.4%)}
.hero.upcoming>.shade{background:linear-gradient(246.66deg,rgba(130,86,0,.3) 2.7%,rgba(26,15,0,.9) 103.4%)}
.hero.busy>.shade,.hero.ending>.shade{background:linear-gradient(246.66deg,rgba(150,22,64,.32) 2.7%,rgba(28,0,10,.9) 103.4%)}
.hero.upcoming .pill.warn{background:#ffe45c;color:#4a3300}
.device.busy,.device.ending{--blue:#b3123f;--blue-d:#8f0e32;--ink:#4a0a1e;--muted:#8a3550;--hdink:#4a0a1e;--paper:#fff5f7;--paper2:#ffe3ea;--line:#efb3c3;--glass:rgba(255,232,238,.6);background:linear-gradient(180deg,#f7c9d8 0%,#d0467a 34%,#8a1240 66%,#4d0a26 100%)}
#bg,#under,#ov,#toastL{position:absolute;inset:0}
#bg,#toastL{pointer-events:none}
#fx{position:absolute;inset:0;width:834px;height:1194px;pointer-events:none;z-index:30}
#ov{pointer-events:none;z-index:10}#ov.on{pointer-events:auto}
#toastL{z-index:20;display:flex;justify-content:center;padding-top:16px;align-items:flex-start}
.blob{position:absolute;border-radius:50%;border:14px solid rgba(255,255,255,.14)}
.logo{position:absolute;left:49px;top:65px;display:flex;align-items:center;gap:18px}
.dots{position:relative;width:82px;height:81px}
.dots i{position:absolute;width:34px;height:34px;border-radius:50%}
.logo b{display:block;border-left:3px solid var(--hdink);padding-left:18px;font:600 34px/34px var(--disp);letter-spacing:.5px;color:var(--hdink)}
.clock{position:absolute;left:429px;top:58px;width:340px;text-align:center;font:300 96px/96px var(--disp);color:var(--hdink);letter-spacing:-2px}
.date{position:absolute;left:429px;top:170px;width:340px;display:flex;align-items:center;gap:14px;font:600 14px var(--disp);letter-spacing:2px;text-transform:uppercase;color:var(--hdink)}
.date:before,.date:after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--hdink) 35%,transparent)}
.main{position:absolute;left:50px;top:219px;width:722px;height:930px;display:flex;flex-direction:column;gap:20px}
.hero{position:relative;height:216px;border-radius:30px;overflow:hidden;color:#fff;padding:24px 28px 28px;display:flex;flex-direction:column;justify-content:flex-start;gap:16px;
  border:1px solid rgba(255,255,255,.4);box-shadow:0 20px 50px rgba(0,0,0,.25);
  background:#1c2a38}
.hero .sky{position:absolute;inset:0;opacity:.55;background:
  linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.12) 9% 9.5%,transparent 9.5% 28%,rgba(255,255,255,.12) 28% 28.5%,transparent 28.5% 55%,rgba(255,255,255,.12) 55% 55.5%,transparent 55.5%),
  linear-gradient(180deg,rgba(170,200,225,.35),rgba(60,80,100,.2));filter:blur(1.5px)}
.hero .city{position:absolute;right:40px;top:90px;width:360px;height:150px;opacity:.5;
  background:
   linear-gradient(#5d7388,#5d7388) 0 100%/30px 70% no-repeat,
   linear-gradient(#6b8196,#6b8196) 40px 100%/26px 100% no-repeat,
   linear-gradient(#566c81,#566c81) 80px 100%/40px 55% no-repeat,
   linear-gradient(#6b8196,#6b8196) 135px 100%/30px 90% no-repeat,
   linear-gradient(#5d7388,#5d7388) 180px 100%/44px 65% no-repeat,
   linear-gradient(#6b8196,#6b8196) 240px 100%/28px 80% no-repeat,
   linear-gradient(#566c81,#566c81) 285px 100%/50px 50% no-repeat}
.hero>*{position:relative}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;font:600 16px var(--sans)}
.pill.free{background:#cdeed8;color:#0f6a31}
.pill.free:before{content:"";width:9px;height:9px;border-radius:50%;background:#1aa04a}
.pill.warn{background:#ffe08a;color:#6b4400}
.pill.busy{background:#ffd1dc;color:#8a0e33}
.pill.busy:before{content:"";width:9px;height:9px;border-radius:50%;background:#e0245e}
.hero h1{font:600 36px/1.12 var(--disp);letter-spacing:-.36px;text-wrap:balance}
.hero .sub{font:400 18px var(--disp);opacity:.92}
.hero .top{position:absolute;top:26px;right:30px;font:500 14px var(--disp);opacity:.75}
.hero .big{font:600 62px/1 var(--disp);letter-spacing:-1px;display:flex;align-items:baseline;gap:12px}
.hero .big small{font:400 18px var(--sans);opacity:.85;letter-spacing:0}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;background:#fff;border-radius:9px;transition:transform 1s linear}
.hero.ending .bar i{background:#ffd34d}
.hero.ending .big{color:#ffd34d}
.note{font:500 14px var(--sans);color:#ffd9e3;display:flex;gap:8px;align-items:center}
.actions{display:flex;gap:14px;flex:none}
.act{flex:1;height:76px;border-radius:18px;display:flex;align-items:center;gap:14px;padding:0 18px;text-align:left;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.14);color:#fff;transition:background .2s}
.act.light{background:rgba(255,255,255,.93);color:#0b2236;border-color:transparent}
.act .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.act.light .ic{background:color-mix(in srgb,var(--blue) 18%,#fff);color:var(--blue)}
.act.light.danger .ic{background:var(--bad-bg);color:var(--bad)}
.act strong{display:block;font:600 18px var(--disp)}
.act span.s{display:block;font-size:15px;opacity:.8;margin-top:2px}
.act .chev{margin-left:auto;opacity:.6}
.act[disabled]{opacity:.45;pointer-events:none}
.banner{flex:none;border-radius:20px;padding:12px 20px 11px;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.18);background:linear-gradient(100deg,#0d6fb8,#064a80);transition:background .6s}
.device.upcoming .banner{background:linear-gradient(100deg,#9a6a00,#6b4700)}
.device.busy .banner,.device.ending .banner{background:linear-gradient(100deg,#8f1239,#790530)}
.bn-top{display:flex;align-items:center}
.bn-cell{flex:1;display:flex;align-items:center;gap:12px;min-width:0}
.bn-cell+.bn-div+.bn-cell{justify-content:flex-end}
.bn-ic{width:36px;height:36px;flex:none}
.bn-div{width:1px;align-self:stretch;min-height:38px;background:rgba(255,255,255,.3);margin:0 16px}
.bn-l{font:400 13px/1.2 var(--sans);opacity:.85}
.bn-v{font:600 24px/1.15 var(--disp);letter-spacing:-.2px;white-space:nowrap}
.bn-rule{height:1px;background:rgba(255,255,255,.4);margin:9px 0 8px}
.bn-info{display:flex;gap:8px;align-items:center;font:400 14px/1.3 var(--sans);opacity:.92}
.bn-info span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bn-info svg{flex:none}
.sched{flex:1;min-height:0;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65);box-shadow:0 18px 40px rgba(0,0,0,.15)}
.sched .hd{display:flex;justify-content:space-between;align-items:flex-start}
.sched h2{font:600 22px var(--disp)} .sched .hd p{font-size:15px;color:var(--muted);margin-top:3px}
.pickdate{position:relative}
.pickdate>button{display:flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;background:color-mix(in srgb,var(--paper) 78%,transparent);color:var(--blue);font:600 16px var(--sans);border:1px solid color-mix(in srgb,var(--paper) 80%,transparent)}
.menu{position:absolute;right:0;top:50px;width:230px;max-height:300px;overflow:auto;background:var(--paper);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.28);padding:6px;z-index:5;transform-origin:top right}
.menu button{display:flex;align-items:center;min-height:46px;justify-content:space-between;width:100%;padding:10px 14px;border-radius:10px;font:500 15px var(--sans);text-align:left}
.menu button.on{background:color-mix(in srgb,var(--blue) 10%,#fff);color:var(--blue-d)}@media(hover:hover) and (pointer:fine){.menu button:hover{background:color-mix(in srgb,var(--blue) 10%,#fff);color:var(--blue-d)}}
.days{display:flex;gap:8px}
.day{flex:1;height:76px;border-radius:14px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;color:var(--muted);position:relative}
.day b{font:600 24px var(--disp);color:var(--ink)}
.day.on{background:var(--blue);color:#d6e9f7}.day.on b{color:#fff}
.day .dot{position:absolute;bottom:8px;width:6px;height:6px;border-radius:50%;background:var(--blue)} .day.on .dot{background:#fff}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;border-radius:16px;background:color-mix(in srgb,var(--paper) 40%,transparent);border:1px solid color-mix(in srgb,var(--paper) 70%,transparent);padding:14px;display:flex;flex-direction:column;gap:10px}
.list h3{font:600 20px var(--disp)} .list .hint{font-size:15px;color:var(--muted);margin-top:-6px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 14px;margin-top:4px}
.chip{height:54px;border-radius:12px;background:var(--paper);border:1.5px solid color-mix(in srgb,var(--blue) 40%,#fff);font:600 18px var(--sans);color:var(--blue)}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 12px 8px 14px;border-radius:12px;background:var(--paper);flex:none}
.row .t{width:46px;font:600 15px var(--sans)}.row .t small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.row .sep{width:2px;align-self:stretch;background:var(--blue);border-radius:2px}
.row .w{flex:1;font:600 15px var(--sans);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .w small{display:block;width:100%;font-weight:500;color:var(--muted);font-size:13px}
.row.gap{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.row.gap .sep{align-self:stretch}
.gw{flex-direction:column;align-items:flex-start!important;gap:8px}
.gl{font:600 17px var(--disp);color:var(--ink)}
.gl small{display:block;font:400 15px var(--sans);color:var(--muted);margin-top:2px}
.gw .chips{width:100%;margin-top:0}
.chip.more{background:transparent;border-style:dashed;color:var(--muted)}
.row.creq .sep{background:var(--bad)}
.row.creq{box-shadow:inset 0 0 0 1.5px rgba(200,16,46,.3)}
.row.free .w{color:var(--muted);font-weight:500}
.row.now{background:var(--paper);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--blue) 35%,transparent)}
.row.up{background:#ffd43b;color:#3d2b00}.row.up .t small,.row.up .w small{color:#6b4c00}.row.up .sep{background:#3d2b00}
.btn{height:44px;min-width:76px;padding:0 22px;border-radius:10px;background:var(--blue);color:#fff;font:600 15px var(--sans)}
.trash{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--bad)}
.row.up .trash{color:var(--bad)}
.device.busy .row.up,.device.ending .row.up{background:var(--paper2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.device.busy .row.up .t small,.device.busy .row.up .w small,.device.ending .row.up .t small,.device.ending .row.up .w small{color:var(--muted)}
.device.busy .row.up .sep,.device.ending .row.up .sep{background:var(--blue)}
.device.busy .row.up .trash,.device.ending .row.up .trash{color:var(--bad)}
.device.busy .tag:not(.now):not(.cr),.device.ending .tag:not(.now):not(.cr){background:var(--paper);color:var(--blue)}
.tag{font:600 12px var(--sans);padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--blue) 16%,var(--paper));color:var(--blue-d)}
.tag.now{background:var(--blue);color:#fff}.tag.cr{background:var(--bad-bg);color:var(--bad-ink)}
/* overlays (animated with GSAP, no CSS keyframes) */
.scrim{position:absolute;inset:0;background:rgba(5,20,35,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.device.upcoming .scrim{background:rgba(70,46,0,.5)}
.device.busy .scrim,.device.ending .scrim{background:rgba(58,4,22,.5)}
.sheet{position:absolute;left:20px;right:20px;bottom:24px;background:var(--paper);border-radius:30px;padding:0 32px 30px;box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.5) inset;will-change:transform}
.grab{height:34px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.grab:before{content:"";width:48px;height:5px;border-radius:9px;background:var(--line)}
.sheet .sh-hd{touch-action:none}
.sh-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.sh-hd h2{font:600 24px var(--disp)} .sh-hd p{font-size:15px;color:var(--muted);margin-top:4px}
.x{width:44px;height:44px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;color:var(--muted);flex:none}
.lbl{font:600 15px var(--sans);color:var(--muted);margin:14px 0 8px}.lbl em{font-style:normal;color:var(--blue);margin-left:8px;font-weight:600}
.seg{position:relative;display:flex;gap:10px}
.seg .ind{position:absolute;left:0;top:0;height:100%;width:0;border-radius:10px;background:var(--blue);box-shadow:0 8px 18px color-mix(in srgb,var(--blue) 35%,transparent);pointer-events:none;z-index:0}
.seg button{position:relative;z-index:1;flex:1;height:50px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font:600 15px var(--sans);color:var(--ink);transition:color .25s,border-color .25s}
.seg button.on{border-color:transparent;color:#fff}
.seg button[disabled]{background:var(--paper2);color:color-mix(in srgb,var(--muted) 55%,transparent);border-color:var(--line);pointer-events:none}
.segrow{display:flex;gap:8px;align-items:center}.segrow .seg{flex:1}
.navarr{flex:none}.navarr[disabled]{opacity:.35;pointer-events:none}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.avail{font:600 13px var(--sans);color:var(--blue);white-space:nowrap}
.ctog{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;margin-top:12px;border-radius:10px;color:var(--blue);font:600 15px var(--sans);border:1.5px dashed var(--line);transition:background .2s}
.ctog[aria-expanded=true]{background:var(--paper2);border-style:solid}
.custom{overflow:hidden;margin-top:12px;padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stp{border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.stp .sl{font:600 13px var(--sans);color:var(--muted)}
.stp .sc{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stp .tv{font:600 26px var(--disp);color:var(--ink);min-width:72px;text-align:center;white-space:nowrap}
.stp .tv small{font:500 13px var(--sans);color:var(--muted)}
.stp button{min-width:44px;height:44px;padding:0 6px;border-radius:10px;background:var(--paper2);color:var(--blue);font:600 14px var(--sans)}
.req{color:var(--bad);margin-left:2px}
.emsg{margin-top:8px;font:500 14px var(--sans);color:var(--bad-ink);display:flex;gap:6px;align-items:center}
.input.invalid{border-color:var(--bad);box-shadow:0 0 0 4px rgba(200,16,46,.14)}
.cta.off{background:var(--paper2);color:var(--muted)}
.res .hint{margin-left:auto;font:600 12px var(--sans);color:var(--blue)}
.res mark{background:none;color:var(--blue);font-weight:700}
.input{width:100%;height:54px;border-radius:12px;border:1.5px solid var(--line);padding:0 16px;font:500 16px var(--sans);color:var(--ink);outline:0;background:var(--paper);display:flex;align-items:center;gap:10px;transition:border-color .2s,box-shadow .2s}
.input:focus,.input:focus-visible{border-color:var(--blue);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 18%,transparent);outline:none}
input.input{display:block}
.results{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.res{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-radius:0}
.res:focus-visible{background:color-mix(in srgb,var(--blue) 10%,#fff);outline-offset:-3px}@media(hover:hover) and (pointer:fine){.res:hover{background:color-mix(in srgb,var(--blue) 10%,#fff);outline-offset:-3px}}
.av{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--blue) 16%,#fff);color:var(--blue);display:grid;place-items:center;font:700 12px var(--sans);flex:none}
.res b{display:block;font:600 14px var(--sans)}.res small{font-size:13px;color:var(--muted)}
.picked{height:62px}
.picked .x{margin-left:auto;width:44px;height:44px;background:none}

/* ---- confetti: a short, one-off burst when a booking succeeds ---- */
let fxRun=0;
function confetti(ox,oy){
  if(RM)return;
  const cv=$('#fx'),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=834*dpr;cv.height=1194*dpr;
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const cl=$('#dev').className;
  const acc=cl.includes('upcoming')?['#ffd43b','#f0a800']:cl.includes('busy')||cl.includes('ending')?['#e0245e','#ff8fab']:['#0a5c9c','#3fb4e8'];
  const cols=['#1fa24a','#3ccf6a','#8be3a8','#14833b','#2fb85a',...acc];
  const P=[];
  for(let i=0;i<120;i++){
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.25,v=8+Math.random()*14;
    P.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:6+Math.random()*7,h:4+Math.random()*6,
      r:Math.random()*6.28,vr:(Math.random()-.5)*.35,tilt:Math.random()*6.28,col:cols[i%cols.length],round:Math.random()<.28});
  }
  const id=++fxRun;let last=performance.now();const T0=last;
  (function frame(now){
    if(id!==fxRun)return;
    const dt=Math.min(32,now-last)/16.67;last=now;
    const age=(now-T0)/1000,fade=age>1.7?Math.max(0,1-(age-1.7)/.7):1;
    c.clearRect(0,0,834,1194);let alive=0;
    for(const p of P){
      p.vy+=.34*dt;const drag=Math.pow(.985,dt);p.vx*=drag;p.vy*=drag;
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;p.tilt+=.16*dt;
      if(fade<=0||p.y>1260)continue;alive++;
      c.save();c.globalAlpha=fade;c.translate(p.x,p.y);c.rotate(p.r);
      c.scale(1,Math.abs(Math.cos(p.tilt))*.85+.15);c.fillStyle=p.col;
      if(p.round){c.beginPath();c.arc(0,0,p.w/2.4,0,6.283);c.fill()}else c.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      c.restore();
    }
    if(alive&&age<2.5)requestAnimationFrame(frame);else c.clearRect(0,0,834,1194);
  })(T0);
}

  else if(a=='pstart'){S.pick.start=+el.dataset.s;S.pick.err='';let l=S.pick.len;while(l>15&&overlap(S.day,S.pick.start,S.pick.start+l))l-=15;S.pick.len=l;keep();refreshOv()}
  else if(a=='custom'){S.pick.custom=!S.pick.custom;keep();refreshOv();const c=$('#cust');if(c)g.from(c,{height:0,opacity:0,duration:.28,ease:'power3.out',clearProps:'height,opacity'})}
  else if(a=='tstep'){const pk=S.pick,i=S.day,d=+el.dataset.d,lo=minStart(i),hi=17*60+55;
    let t=Math.max(lo,Math.min(hi,pk.start+d));const m=overlap(i,t,t+5);
    if(m){t=d>0?Math.ceil(m.e/5)*5:Math.floor((m.s-5)/5)*5}
    if(t<lo||t>hi||overlap(i,t,t+5)||t===pk.start){const tv=$('.stp .tv');tv&&g.fromTo(tv,{x:-6},{x:0,duration:.35,ease:'elastic.out(1,.4)'});return}
    pk.start=t;while(pk.len>5&&overlap(i,t,t+pk.len))pk.len-=5;
    const all=allStarts(i),ix=all.indexOf(t);if(ix>=0&&(ix<pk.win||ix>=pk.win+6))pk.win=Math.max(0,Math.min(all.length-6,ix-1));
    keep();refreshOv()}
  else if(a=='lstep'){const pk=S.pick,i=S.day,d=+el.dataset.d,cap=maxLenAt(i,pk.start);
    const l=Math.max(5,Math.min(cap,pk.len+d));if(l===pk.len){const tv=$$('.stp .tv')[1];tv&&g.fromTo(tv,{x:-6},{x:0,duration:.35,ease:'elastic.out(1,.4)'});return}
    pk.len=l;keep();refreshOv()}
  else if(a=='wprev'){S.pick.win=Math.max(0,S.pick.win-3);keep();refreshOv()}
  else if(a=='wnext'){S.pick.win=Math.min(allStarts(S.day).length-6,S.pick.win+3);keep();refreshOv()}
  else if(a=='plen'){S.pick.len=+el.dataset.l;keep();refreshOv()}
  else if(a=='who'){S.pick.who=SUG[+el.dataset.k];S.pick.q=S.pick.who.e;keep();refreshOv('.cta')}
  else if(a=='unwho'){S.pick.q=S.pick.who?S.pick.who.e:'';S.pick.who=null;S.pick.touched=false;S.pick.tried=false;keep();refreshOv('#q')}
  else if(a=='confirm')confirmBook();
  else if(a=='done')goHome();
  else if(a=='startq'){const l=+el.dataset.l,s=Math.floor(nowM());S.meetings.push({id:S.uid++,day:0,s,e:s+l,title:'Quick meeting',by:'Started at the room'});closeOv(()=>renderBase('hero'))}
  else if(a=='ext'){const c=current(),l=+el.dataset.l;if(c&&canExtend(l)){c.e+=l;closeOv(()=>{renderBase();toast(`Extended until ${fm(c.e)}`)})}}
  else if(a=='end')showOv({k:'end'});
  else if(a=='doend'){const c=current();if(c)c.e=Math.floor(nowM());closeOv(()=>{renderBase('hero');toast('Meeting ended. The room is free.')})}
  else if(a=='cancel')showOv({k:'cancel',m:S.meetings.find(m=>m.id==+el.dataset.id)});
  else if(a=='sendcancel'){S.ov.m.cancelReq=true;closeOv(()=>{renderBase();toast('We emailed the organiser. The meeting stays booked until they approve.','bad','Cancel request sent')})}
});
function keep(){const s=$('#subj');if(s&&S.pick)S.pick.subject=s.value}
document.addEventListener('input',e=>{
  if(e.target.id=='q'){const p=S.pick;p.q=e.target.value;const r=suggest(p.q);
    const box=$('#res'),was=box.hidden;box.innerHTML=resHtml(r,p.q);box.hidden=!r.length;
    if(was&&r.length)g.from(box,{height:0,opacity:0,duration:.3,ease:'power2.out',clearProps:'height,opacity'});
    syncEmail()}
  if(e.target.id=='subj')S.pick.subject=e.target.value});
/* live "required" state: button looks ready only once the email is valid */
function syncEmail(){const p=S.pick,q=$('#q');if(!q)return;const ok=emailOk((p.q||'').trim());
  const cta=$('.cta');cta&&cta.classList.toggle('off',!ok);if(!p.err){const te=$('#err');if(te&&ok)te.remove()}const f=$('#cfine');if(f)f.hidden=ok;
  const bad=!ok&&(p.tried||(p.touched&&document.activeElement!==q));q.classList.toggle('invalid',bad);const m=$('#emsg');
  if(m){const was=m.hidden;m.hidden=!bad;m.lastChild.textContent=' '+(p.q?'Check your email address, e.g. name@pengroup.com':'Email is required to confirm the booking');if(was&&bad)g.from(m,{y:-6,opacity:0,duration:.3})}}
document.addEventListener('focusout',e=>{if(e.target.id!='q')return;setTimeout(()=>{const p=S.pick;if(!OV||!p||p.who||!$('#q')||document.activeElement.closest&&document.activeElement.closest('#res'))return;if(document.activeElement.id=='q')return;p.touched=true;syncEmail()},160)});
/* ---- keyboard: Tab trap, Esc, arrows, Enter ---- */
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  if(e.key=='Escape'){if(OV){e.preventDefault();S.ov&&S.ov.k=='ok'?goHome(true):closeOv(null,true)}else if(S.menu){e.preventDefault();closeMenu(true,true)}return}
  if(e.key=='Tab'&&OV){const p=$('#ov .sheet,#ov .modal');if(!p)return;
    const f=$$('button:not([disabled]),input',p).filter(x=>!x.closest('[hidden]'));if(!f.length){e.preventDefault();return}
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&(ae===first||ae===p)){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&(ae===last||ae===p&&false)){e.preventDefault();first.focus()}
    else if(!p.contains(ae)){e.preventDefault();first.focus()}
    return}
  if(e.key=='Enter'&&ae&&ae.id=='q'){e.preventDefault();const r=$('#res .res'),p=S.pick,em=(p.q||'').trim();
    if(emailOk(em)){p.who=SUG.find(s=>s.e.toLowerCase()==em.toLowerCase())||{n:nameFrom(em),e:em};refreshOv('.cta')}else if(r)r.click();else{p.touched=true;syncEmail()}return}
  if((e.key=='ArrowRight'||e.key=='ArrowLeft')&&ae&&ae.getAttribute('role')=='tab'){
    const tabs=$$('button:not([disabled])',ae.parentElement),i=tabs.indexOf(ae)+(e.key=='ArrowRight'?1:-1);
    if(tabs[i]){e.preventDefault();tabs[i].click()}return}
  if((e.key=='ArrowDown'||e.key=='ArrowUp')){
    if(ae&&ae.id=='q'&&e.key=='ArrowDown'){const r=$('#res .res');if(r){e.preventDefault();r.focus()}}
    else if(ae&&ae.classList.contains('res')){e.preventDefault();const all=$$('.res');const i=all.indexOf(ae)+(e.key=='ArrowDown'?1:-1);if(i<0)$('#q').focus();else if(all[i])all[i].focus()}
    else if(ae&&ae.closest('.menu')){e.preventDefault();const all=$$('.menu button');const i=Math.max(0,Math.min(all.length-1,all.indexOf(ae)+(e.key=='ArrowDown'?1:-1)));all[i].focus()}
  }
});
/* ---- press feedback (GSAP) ---- */
const PRESS='.btn,.act,.chip,.tdy,.day,.card,.cta,.seg button,.x,.res,.trash,.duo button,.pickdate>button,.menu button';
let pressed=null;
document.addEventListener('pointerdown',e=>{const el=e.target.closest(PRESS);if(!el||el.disabled)return;pressed=el;g.to(el,{scale:.97,duration:.12,ease:'power2.out',overwrite:'auto'})});
const release=()=>{if(pressed){const el=pressed;pressed=null;g.to(el,{scale:1,duration:.2,ease:'power2.out',overwrite:'auto',clearProps:'transform'})}};
addEventListener('pointerup',release);addEventListener('pointercancel',release);
/* ---- drag the sheet down to dismiss ---- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  if(!OV||!OV.isSheet)return;const h=e.target.closest('[data-grab],.sheet .sh-hd');if(!h||e.target.closest('button'))return;
  const sheet=$('#ov .sheet'),scrim=$('#ov .scrim');g.killTweensOf([sheet,scrim]);
  drag={y0:e.clientY,t0:performance.now(),dy:0,sheet,scrim};try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!drag)return;let dy=(e.clientY-drag.y0)/SCALE;if(dy<0)dy*=.18;drag.dy=dy;
  g.set(drag.sheet,{y:dy});g.set(drag.scrim,{opacity:1-Math.min(.85,Math.max(0,dy)/520)})});
const endDrag=()=>{if(!drag)return;const d=drag;drag=null;const v=d.dy/Math.max(1,performance.now()-d.t0);
  if(d.dy>150||(d.dy>50&&v>.6)){g.to(d.sheet,{y:d.sheet.offsetHeight,duration:.3,ease:'power2.in'});closeOv()}
  else{g.to(d.sheet,{y:0,duration:.4,ease:'power3.out'});g.to(d.scrim,{opacity:1,duration:.3})}};
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);
/* ---- demo + clock ---- */
function demo(k){
  if(k=='reset'){if(OV){OV=null;$('#ov').innerHTML='';$('#ov').classList.remove('on');$('#under').inert=false}S=fresh();renderBase('init')}
  if(k=='skip5'||k=='skip10'){S.t+=(k=='skip5'?300:600);tick(true)}
  if(k=='upcoming'){demo('reset');S.meetings.push({id:S.uid++,day:0,s:14*60+50,e:15*60+30,title:'Client call',by:'Priya S.'});renderBase('hero')}
  if(k=='collide'){const s=S.pick?S.pick.start:15*60,i=S.pick?S.day:0;S.meetings.push({id:S.uid++,day:i,s,e:s+30,title:'Booked elsewhere',by:'Tania M.'});if(!OV)renderBase()}}
function tick(forced){
  if(!forced)S.t+=1;
  tickLabels();
  const cur=current();
  if(cur){const left=Math.max(0,cur.e*60-S.t);updateDigits(left);
    const pg=$('#pg');if(pg)pg.style.transform='scaleX('+Math.min(1,(S.t-cur.s*60)/((cur.e-cur.s)*60))+')'}
  const upn=$('#upin'),nx=next();if(upn&&nx)upn.textContent=Math.max(1,Math.ceil((nx.s*60-S.t)/60));
  const bv=$('#bval');if(bv){const t=bval();if(bv.textContent!==t)bv.textContent=t}
  idleCheck();
  const sg=sigOf();
  if(sg!==S.sig){const was=S.sig.split('|')[0];
    if(!OV){renderBase('hero');if((was=='busy'||was=='ending')&&!cur)toast('Meeting ended. The room is free.')}else{S.sig=sg;$('#dev').className='device '+status()}}
  if(S.ov&&S.ov.k=='ok'){const left=Math.max(0,15-Math.floor((Date.now()-S.doneT)/1000));S.ov.left=left;
    const b=$('#back');if(b)b.textContent=`Back to the room screen in ${left}s`;
    const ab=$('#autobar');if(ab)ab.style.transform=`scaleX(${Math.max(0,(left-1)/15)})`;
    if(!left)goHome()}
}
/* unattended kiosk: after 60s of no touch/keys, drop any open popup/menu and go back to today */
let lastAct=Date.now();
['pointerdown','keydown','input'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()},true));
function idleCheck(){
  if(Date.now()-lastAct<60000)return;
  if(OV&&S.ov&&S.ov.k!=='ok'){lastAct=Date.now();S.pick=null;closeOv(()=>{S.day=0;renderBase('list');toast('Back on the room screen after 60 seconds of inactivity','info')})}
  else if(!OV&&(S.day!==0||S.menu)){lastAct=Date.now();S.day=0;S.menu=false;S.dates=false;renderBase('list')}
}
function fit(){SCALE=Math.min((innerHeight-24)/1194,(innerWidth-(innerWidth>1200?300:0))/834,1);const st=$('#stage');st.style.transform=`scale(${SCALE})`;st.style.margin=`${-(1194*(1-SCALE))/2}px ${-(834*(1-SCALE))/2}px`}
addEventListener('resize',fit);
S=fresh();setupStatic();fit();renderBase('init');setInterval(()=>tick(),1000);
</script>
